# =============================================================
# EXAMPLE — repos/infra/Pipelines/provision-pipeline.yaml
# Project  : AppMod (LC-Production)
# Playbook : deployment/ansible/site.yml (skip app_deploy)
# Groups   : jump, db_{env}, app_{env}, nginx_{env}
# Envs     : dev, prod
#
# THIS FILE LIVES IN THE infra REPOSITORY at:
#   setup/azure/pipelines/repos/infra/Pipelines/provision-pipeline.yaml
# =============================================================

trigger: none
pr: none

parameters:
  - name: targetEnv
    displayName: "Target environment"
    type: string
    default: dev
    values:
      - dev
      - prod
      - all

variables:
  - template: ../../../templates/variables/global.yaml
  - group: Common

stages:
  # =============================================================
  # DEV provisioning
  # =============================================================
  - stage: Provision_Dev
    displayName: "Provision DEV VMs"
    dependsOn: []
    condition: in('${{ parameters.targetEnv }}', 'dev', 'all')

    variables:
      - template: ../../../templates/variables/global-dev.yaml
      - group: Secrets-dev

    jobs:
      - deployment: Provision
        displayName: "Provision DEV infrastructure"
        pool:
          vmImage: ubuntu-latest
        environment: AppMod-dev
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  path: infra
                  persistCredentials: false
                  displayName: "Checkout infra repo"

                - bash: pip3 install --quiet ansible
                  displayName: "Install Ansible"

                - bash: |
                    if ! command -v terraform &>/dev/null; then
                      TF_VERSION=$(curl -fsSL https://api.releases.hashicorp.com/v1/releases/terraform/latest \
                        | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])")
                      curl -fsSL \
                        "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" \
                        -o /tmp/terraform.zip
                      sudo unzip -o /tmp/terraform.zip -d /usr/local/bin terraform
                      rm /tmp/terraform.zip
                    fi
                    terraform version
                  displayName: "Install Terraform CLI"

                - bash: |
                    terraform -chdir=$(Pipeline.Workspace)/infra/deployment/terraform/dev \
                      init -input=false -reconfigure
                  displayName: "Terraform init (for dynamic inventory)"
                  env:
                    GOOGLE_CREDENTIALS: $(GCP_SA_KEY_JSON)

                - task: DownloadSecureFile@1
                  name: sshKeyDev
                  displayName: "Download DEV SSH key"
                  inputs:
                    secureFile: "$(SSH_SECURE_FILE_DEV)"

                - bash: chmod 600 $(sshKeyDev.secureFilePath)
                  displayName: "Set DEV SSH key permissions"

                - bash: |
                    cd $(Pipeline.Workspace)/infra/deployment/ansible

                    ansible-playbook site.yml \
                      -i inventory/dynamic_inventory.sh \
                      --limit "jump,db_dev,app_dev,nginx_dev" \
                      --skip-tags app_deploy \
                      --extra-vars "ssh_private_key_file_dev=$(sshKeyDev.secureFilePath) \
                                    ssh_private_key_file_prod=$(sshKeyDev.secureFilePath)"
                  displayName: "Provision DEV VMs with Ansible"
                  env:
                    GOOGLE_CREDENTIALS: $(GCP_SA_KEY_JSON)

  # =============================================================
  # PROD provisioning
  # =============================================================
  - stage: Provision_Prod
    displayName: "Provision PROD VMs"
    dependsOn: []
    condition: in('${{ parameters.targetEnv }}', 'prod', 'all')

    variables:
      - template: ../../../templates/variables/global-prod.yaml
      - group: Secrets-prod

    jobs:
      - deployment: Provision
        displayName: "Provision PROD infrastructure"
        pool:
          vmImage: ubuntu-latest
        environment: AppMod-prod
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  path: infra
                  persistCredentials: false
                  displayName: "Checkout infra repo"

                - bash: pip3 install --quiet ansible
                  displayName: "Install Ansible"

                - bash: |
                    if ! command -v terraform &>/dev/null; then
                      TF_VERSION=$(curl -fsSL https://api.releases.hashicorp.com/v1/releases/terraform/latest \
                        | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])")
                      curl -fsSL \
                        "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" \
                        -o /tmp/terraform.zip
                      sudo unzip -o /tmp/terraform.zip -d /usr/local/bin terraform
                      rm /tmp/terraform.zip
                    fi
                    terraform version
                  displayName: "Install Terraform CLI"

                - bash: |
                    terraform -chdir=$(Pipeline.Workspace)/infra/deployment/terraform/prod \
                      init -input=false -reconfigure
                  displayName: "Terraform init (for dynamic inventory)"
                  env:
                    GOOGLE_CREDENTIALS: $(GCP_SA_KEY_JSON)

                - task: DownloadSecureFile@1
                  name: sshKeyDev
                  displayName: "Download DEV SSH key"
                  inputs:
                    secureFile: "$(SSH_SECURE_FILE_DEV)"

                - bash: chmod 600 $(sshKeyDev.secureFilePath)
                  displayName: "Set DEV SSH key permissions"

                - task: DownloadSecureFile@1
                  name: sshKeyProd
                  displayName: "Download PROD SSH key"
                  inputs:
                    secureFile: "$(SSH_SECURE_FILE_PROD)"

                - bash: chmod 600 $(sshKeyProd.secureFilePath)
                  displayName: "Set PROD SSH key permissions"

                - bash: |
                    cd $(Pipeline.Workspace)/infra/deployment/ansible

                    ansible-playbook site.yml \
                      -i inventory/dynamic_inventory.sh \
                      --limit "jump,db_prod,app_prod,nginx_prod" \
                      --skip-tags app_deploy \
                      --extra-vars "ssh_private_key_file_dev=$(sshKeyDev.secureFilePath) \
                                    ssh_private_key_file_prod=$(sshKeyProd.secureFilePath)"
                  displayName: "Provision PROD VMs with Ansible"
                  env:
                    GOOGLE_CREDENTIALS: $(GCP_SA_KEY_JSON)
