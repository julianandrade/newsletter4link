trigger: none

name: $(Build.DefinitionName)_$(SourceBranchName)_Validation_$(Date:yyyyMMdd)$(Rev:.r)

resources:
  repositories:
    - repository: infra
      type: git
      name: AppMod/infra
      ref: 'refs/heads/main'

extends:
  template: 'setup/azure/pipelines/templates/main-pipeline.yaml@infra'
  parameters:
    ExecutionType: Validation
