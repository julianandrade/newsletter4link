trigger:
  - develop
  - release/*
  - main

name: $(Build.DefinitionName)+$(SourceBranchName)$(Rev:.r)

resources:
  repositories:
    - repository: infra
      type: git
      name: AppMod/infra
      ref: 'refs/heads/main'

extends:
  template: 'setup/azure/pipelines/templates/main-pipeline.yaml@infra'
