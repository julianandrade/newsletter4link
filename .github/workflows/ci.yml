# The gate that turns "I ran the tests" into something the merge can check.
#
# Until this existed, the only checks on a pull request were GitGuardian and Vercel. Neither
# runs the suite: Vercel's build is `prisma generate && next build`, which type-checks the
# app but never executes a test. So a green PR meant the branch compiled and carried no
# secrets, and whether 1400 assertions passed was whatever the last person to touch it said.
#
# Deliberately not a second build. Vercel already builds every push to a PR and every push
# to master, and reports it as its own check. Repeating it here would double the slowest
# step in the pipeline to learn nothing new.

name: Checks

on:
  pull_request:
    branches: [master]
  # Master too, not only the PR.
  #
  # Merges here are rebases, so the commit that lands on master is not the commit the PR
  # check ran against: it has a different parent and a different sha. That is almost always
  # equivalent and occasionally is not, which is exactly the case worth catching. One extra
  # run per merge is a cheap way to be able to say master itself is green.
  push:
    branches: [master]

# A force-push supersedes what it replaced rather than queueing behind it. Cancelling the
# older run costs nothing: its answer is about code that no longer exists.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Types and unit tests
    runs-on: ubuntu-latest
    # The suite runs in about half a minute and the install dominates. This is well above
    # both, so a hang is reported rather than sitting in the queue forever.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The version this project is developed and deployed on. Vercel's default is Node
          # 24 too, so CI, the dev machine and production agree.
          node-version: "24"
          cache: npm

      # `npm ci` rather than `npm install`, so the lockfile is authoritative and a
      # dependency cannot drift between here and a deployment.
      #
      # This also runs the `postinstall` hook, which is `prisma generate`. Both steps below
      # need the generated client: `tsc` for its types, and any test that imports a module
      # touching `@prisma/client`. It needs no DATABASE_URL, because the datasource block in
      # schema.prisma carries no `url` at all: the connection string reaches Prisma through
      # the pg driver adapter at runtime, so generation is offline by construction.
      - name: Install
        run: npm ci

      - name: Types
        run: npx tsc --noEmit

      # `!cancelled()` so a type error does not hide the test results. One push, both
      # answers, rather than two round trips to learn two things.
      #
      # No `--exclude` here, unlike the incantation the dev machine needs. Locally a bare
      # `npx vitest run` also collects test files out of git worktrees parked under
      # `.claude/`, which report as phantom failures. A CI checkout has only tracked files
      # and there are no tests under `.claude/` in git, so excluding it would be copying a
      # local workaround into a place where it can only do harm: it would silently skip a
      # real test the day somebody adds one there.
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npx vitest run
