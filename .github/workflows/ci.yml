name: CI

# pull_request covers feature branches; pushing to claude/** as well doubled
# every run.
on:
  pull_request:
  push:
    branches:
      - master

# Cancel in-progress runs for the same ref when a new run is triggered.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # ESLint flat config (eslint.config.mjs). Blocking on errors; the many
      # existing warnings (any-types, unused vars, React Compiler hints) do not
      # fail the build.
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          # Media storage is GCS (Phase 3). The bucket name is only read lazily
          # at first GCS call; a placeholder keeps the build green.
          GCS_MEDIA_BUCKET: placeholder-media-bucket
          # Auth.js (Phase 2). Placeholders are fine for a build — the Entra
          # provider is only contacted at runtime sign-in.
          AUTH_SECRET: placeholder-auth-secret-for-build
          AUTH_TRUST_HOST: "true"
          AUTH_MICROSOFT_ENTRA_ID_ID: placeholder-entra-client-id
          AUTH_MICROSOFT_ENTRA_ID_SECRET: placeholder-entra-client-secret
          AUTH_MICROSOFT_ENTRA_ID_ISSUER: https://login.microsoftonline.com/placeholder-tenant-id/v2.0

  # End-to-end tests against an ephemeral local Supabase stack (Postgres +
  # Auth via Docker). Fully self-contained: no secrets, no shared
  # environments — every run gets a fresh database seeded by
  # tests/e2e/seed.ts. AI features run with MOCK_GENERATION/MOCK_SEARCH.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      # Media storage is GCS (Phase 3); the e2e specs never touch media so the
      # bucket name is just a placeholder. (GCS is never actually called.)
      GCS_MEDIA_BUCKET: placeholder-media-bucket
      # Supabase CLI still boots the local Postgres for e2e (NOT auth — that's
      # Auth.js now). These vars are tied to that local stack boot, not storage.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      MOCK_GENERATION: "true"
      MOCK_SEARCH: "true"
      EMAIL_PROVIDER: resend
      RESEND_API_KEY: re_placeholder_e2e
      ANTHROPIC_API_KEY: sk-ant-placeholder-e2e
      OPENAI_API_KEY: sk-placeholder-e2e
      CRON_SECRET: e2e-cron-secret
      UNSUBSCRIBE_SECRET: e2e-unsubscribe-secret
      # Auth.js (Phase 2). E2E_TEST_MODE enables the credentials provider; the
      # NEXT_PUBLIC_ variant renders the password form on /login. NEVER set
      # these in production.
      AUTH_SECRET: e2e-auth-secret-placeholder
      AUTH_TRUST_HOST: "true"
      E2E_TEST_MODE: "true"
      NEXT_PUBLIC_E2E_TEST_MODE: "true"
      E2E_TEST_EMAIL: test@example.com
      E2E_TEST_PASSWORD: Test1234!
      # Entra provider is registered but never contacted in e2e (credentials
      # path is used); placeholders keep provider construction happy.
      AUTH_MICROSOFT_ENTRA_ID_ID: placeholder-entra-client-id
      AUTH_MICROSOFT_ENTRA_ID_SECRET: placeholder-entra-client-secret
      AUTH_MICROSOFT_ENTRA_ID_ISSUER: https://login.microsoftonline.com/placeholder-tenant-id/v2.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (Postgres + Auth)
        run: supabase start

      - name: Export local Supabase keys
        run: |
          STATUS="$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$STATUS" | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS" | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed e2e data
        run: npx tsx tests/e2e/seed.ts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Run Playwright tests
        run: npx playwright test

      # Surface what the page actually rendered when a locator failed —
      # Playwright writes an ARIA snapshot next to each failing test.
      - name: Dump failure context
        if: failure()
        run: |
          find test-results -name "error-context.md" -print -exec cat {} \; 2>/dev/null || true

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
