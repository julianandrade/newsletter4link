# The second daily firing of the scheduled jobs, and the only firing daily-collection can
# be relied on for at all.
#
# It exists because this project's Vercel account is on Hobby, where a cron is capped at
# once per day and a sub-daily expression fails the *build*, not the run. That is not a
# theoretical limit here: `15 */4 * * *` on email-ingest silently broke every deployment
# for days, so the route was never deployed and the job had never once run.
#
# Both schedulers call the same routes with the same credential, and both are safe to
# repeat: an article already seen is counted as a duplicate rather than written again, and
# email-ingest claims rows with a lease so two runs cannot process the same email twice.
#
# Move these schedules into `vercel.json` and delete this file if the account ever goes
# Pro. One scheduler is better than two; two is better than one that cannot fire.

name: Scheduled curation

on:
  schedule:
    # UTC, always. GitHub Actions has no timezone setting, and neither does Vercel Cron.
    #
    # The evening firings are deliberately offset from Vercel's morning ones rather than
    # doubled up, so a failure in one half of the day still leaves the other half to catch
    # the work.
    #
    # The 09:07 collection is not redundancy, it is the only one that works. Vercel's
    # daily-collection cron has never once landed: measured 11 August 2026, the whole
    # `CurationJob` history held no row from `trigger=schedule`, while radar-collect at
    # 06:00 had fired on eight consecutive days and email-ingest every morning. The route
    # is not at fault. `vercel crons run /api/cron/daily-collection` invokes it the way the
    # scheduler does, and it answered with a completed job, 35 found and 3 curated, logged
    # as `Started by schedule`. So the slot is dropped above the application, where nothing
    # in this repository can see it. The visible symptom was a dashboard that showed no run
    # for a day the product had in fact collected, which is the same failure mode as the
    # missing job rows: work nobody can see is indistinguishable from work that never ran.
    #
    # `vercel.json` moves that job from 09:00 to 08:00 in the same change, as the one cheap
    # experiment left. It is a guess rather than a diagnosis: 09:00 and 09:30 were the only
    # two Vercel crons sharing an hour, but weekly-proposal at 09:30 does appear to land
    # (`Edition.proposalRefreshedAt` read 10:11 on 10 August), so the collision theory is
    # weak. If 08:00 starts firing, that was the cause and this line becomes ordinary
    # redundancy. If it does not, this line is the reason the job runs at all.
    #
    # :07 rather than :00 because GitHub queues scheduled workflows and the top of the
    # hour is the most contended minute there. A late run is fine; a skipped one is not.
    # Observed lateness here is 45 to 51 minutes, so treat these as "some time after".
    - cron: "7 9 * * *"  # daily-collection, morning
    - cron: "7 17 * * *" # email-ingest, evening
    - cron: "7 21 * * *" # daily-collection, evening

  # A manual button, so "is the job actually working" is answerable in thirty seconds
  # without waiting for a schedule or holding a secret locally.
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        required: true
        default: both
        type: choice
        options:
          - both
          - daily-collection
          - email-ingest

jobs:
  run:
    runs-on: ubuntu-latest
    # A curation pass over fifteen feeds with model scoring can sit near the route's own
    # 300-second ceiling. This is the client's patience, well above that, so a slow run is
    # reported by the route rather than cut off here.
    timeout-minutes: 15

    steps:
      - name: Decide what this firing runs
        id: plan
        env:
          # Which cron matched, on a schedule run. Empty on workflow_dispatch.
          SCHEDULE: ${{ github.event.schedule }}
          CHOICE: ${{ inputs.job }}
        run: |
          set -euo pipefail

          # One arm per cron above. A schedule with no arm falls through to "both", which
          # runs but is never what was meant: adding a `cron:` and forgetting the arm here
          # is the one edit that fails quietly, so the two lists are kept adjacent on
          # purpose.
          case "${SCHEDULE}" in
            "7 9 * * *")  jobs="daily-collection" ;;
            "7 17 * * *") jobs="email-ingest" ;;
            "7 21 * * *") jobs="daily-collection" ;;
            # No schedule means a hand-pressed run.
            "")           jobs="${CHOICE:-both}" ;;
            *)            jobs="both" ;;
          esac

          if [ "$jobs" = "both" ]; then
            jobs="email-ingest daily-collection"
          fi

          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          echo "Running: $jobs"

      - name: Call the scheduled routes
        env:
          # Same secret Vercel sends on its own cron invocations. `lib/auth/cron.ts` fails
          # closed on a missing one, so an unset secret here is a 503 and no work, never an
          # unauthenticated run.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # The production alias, not a deployment URL. Deployment URLs sit behind Vercel's
          # deployment protection and answer 302 to an SSO page, which is how an earlier
          # self-handover in this codebase fired into nothing for four minutes without
          # logging a thing.
          BASE_URL: ${{ vars.CRON_BASE_URL || 'https://newsletter4link.vercel.app' }}
          JOBS: ${{ steps.plan.outputs.jobs }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET is not set on this repository. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

          failed=0

          for job in ${JOBS}; do
            url="${BASE_URL}/api/cron/${job}?trigger=github-actions"
            echo "::group::${job}"
            echo "POST-equivalent GET ${BASE_URL}/api/cron/${job}"

            # Body and status are captured separately so a failure reports what the route
            # actually said. `--fail` is not used: a 401 or 503 body is the diagnosis, and
            # curl would throw it away.
            #
            # A redirect is a refusal here, never something to follow: the only thing that
            # redirects this request is an authentication wall in front of the route.
            status=$(curl -sS \
              --max-time 600 \
              --retry 2 \
              --retry-connrefused \
              --no-location \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -o response.json \
              -w '%{http_code}' \
              "${url}") || status="000"

            echo "HTTP ${status}"
            # Truncated: a collection run's JSON carries a row per organization and the
            # useful part is the head of it.
            head -c 2000 response.json || true
            echo

            if [ "${status}" != "200" ]; then
              echo "::error::${job} answered ${status}"
              failed=1
            fi
            echo "::endgroup::"
          done

          exit "${failed}"
