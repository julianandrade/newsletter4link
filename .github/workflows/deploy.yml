# =============================================================================
# Cloud Run deploy: builds the Docker image and patches the running service.
#
# REQUIRED REPO VARIABLES (Settings -> Secrets and variables -> Actions -> Variables):
#   GCP_WIF_PROVIDER          Full Workload Identity provider resource name, e.g.
#                             projects/123/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   GCP_DEPLOYER_SA           Deployer service account email (...@newsletter-link-ai-radar.iam.gserviceaccount.com)
#   NEXT_PUBLIC_SUPABASE_URL       Inlined into the client bundle at BUILD time.
#   NEXT_PUBLIC_SUPABASE_ANON_KEY  Inlined into the client bundle at BUILD time.
#   NEXT_PUBLIC_APP_URL            Public app URL, inlined at BUILD time.
#   NEXT_PUBLIC_GCIP_API_KEY       Identity Platform browser key. BUILD time.
#   NEXT_PUBLIC_GCIP_PROJECT_ID    Identity Platform project. BUILD time.
#   NEXT_PUBLIC_GCIP_AUTH_DOMAIN   Where the sign-in popup lives. BUILD time.
#   NEXT_PUBLIC_ENTRA_TENANT_ID    The only sign-in provider. BUILD time.
#
# The four GCIP values are variables rather than secrets on purpose: every one of
# them is inlined into a bundle any visitor can download, so treating them as
# secret would be theatre. The browser key is restricted by HTTP referrer in
# infra/terraform/identity.tf, which is what actually protects it.
#
# They are also the reason this workflow was a trap until now. It passed only the
# three Supabase arguments, so a build from CI produced an image whose browser
# bundle had no Identity Platform config and silently fell back to Supabase auth:
# a green deploy that nobody could sign in to. NEXT_PUBLIC_* is inlined at build
# time, so the values Terraform sets on the Cloud Run service reach the server and
# never the browser. That failure mode has already cost this project two days, and
# it is why the daily bug hunt greps the deployed chunks for `AIzaSy`.
#
# This workflow is LIVE. All nine variables are set, WIF authenticates, and since
# 20 August every merge to master ships to production after `verify` passes. It
# ran manually twice first, on 08664a4 and 6d64a10, both verified in the browser.
# Vercel is irrelevant now: that project is paused and `vercel.json` sets
# `git.deploymentEnabled: false`.
#
# Service config (CPU/memory/env/secrets/scaling/ingress) is owned by Terraform.
# This workflow only ships a new image: `gcloud run deploy --image <ref>` on an
# existing service patches the image and PRESERVES all other Terraform-managed
# settings. Do NOT add --set-env-vars / --set-secrets here or they would drift.
# =============================================================================

name: Deploy to Cloud Run

on:
  # Every merge to master ships. Julian's call, 20 August, after two manual deploys had
  # succeeded and the deploy gained its own smoke check.
  #
  # This trigger was deliberately absent for weeks, for a reason that has now expired: with
  # WIF unconfigured the auth step failed fast, so it would have painted master red after
  # every merge for weeks, which is how a team learns to ignore a failing check. Then through
  # Phases C and D it would have deployed on every merge while the service was idle and its
  # database mid-migration. Neither is true any more.
  #
  # The risk that remains, and it is real: there is no staging environment and one Cloud SQL
  # instance, so a merge reaches the only database the product has. The smoke check below
  # makes a bad revision loud within a couple of minutes rather than silent until 06:17. It
  # does not make one impossible. Rollback is `gcloud run services update-traffic` to the
  # previous revision, and Cloud Run keeps them.
  push:
    branches: [master]
  workflow_dispatch:

# One deploy at a time, and a queued one waits rather than replacing the running one. Two
# merges a minute apart would otherwise race to `gcloud run deploy` and the revision that
# ends up serving is whichever finished last, not whichever is newer. cancel-in-progress is
# off on purpose: cancelling a job midway through `gcloud run deploy` is how you get a
# half-applied service.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  GCP_PROJECT: newsletter-link-ai-radar
  GCP_REGION: europe-southwest1
  SERVICE: newsletter4link
  # Artifact Registry repo `app` is created by infra/terraform/registry.tf.
  IMAGE_REPO: europe-southwest1-docker.pkg.dev/newsletter-link-ai-radar/app/newsletter4link

jobs:
  # Nothing ships that has not passed the same three gates a PR passes. Master is behind a
  # required PR, so this is usually a formality, but a rebase merge lands a sha that no check
  # has ever seen: different parent, different commit. That is exactly why `ci.yml` re-runs on
  # master, and it is not a gate if the deploy does not wait for it.
  #
  # Deliberately duplicated here rather than chained off `ci.yml` with `workflow_run`. That
  # trigger runs in the context of the default branch and reports `GITHUB_SHA` as the branch
  # tip rather than the commit that fired it, so the image would occasionally be tagged with a
  # sha it was not built from. Three npm commands is a cheaper price than a deploy pipeline
  # that mislabels what it shipped.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Types
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Lint
        run: npm run lint

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Refuse before building, not after deploying. An image is only wrong once it is
      # running, and the way this goes wrong is invisible: sign-in falls back to Supabase
      # and the deploy reports success. Checking costs nothing and the alternative is an
      # outage discovered by a person trying to log in.
      - name: Every build-time variable is set
        run: |
          set -uo pipefail
          missing=""
          for name in \
            NEXT_PUBLIC_APP_URL \
            NEXT_PUBLIC_GCIP_API_KEY \
            NEXT_PUBLIC_GCIP_PROJECT_ID \
            NEXT_PUBLIC_GCIP_AUTH_DOMAIN \
            NEXT_PUBLIC_ENTRA_TENANT_ID
          do
            eval "value=\${$name:-}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Unset repo variables:${missing}. NEXT_PUBLIC_* is inlined at build"
            echo "::error::time, so building without them yields a bundle that cannot sign anyone in."
            echo "::error::Set them under Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi
          echo "All build-time variables present."
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_GCIP_API_KEY: ${{ vars.NEXT_PUBLIC_GCIP_API_KEY }}
          NEXT_PUBLIC_GCIP_PROJECT_ID: ${{ vars.NEXT_PUBLIC_GCIP_PROJECT_ID }}
          NEXT_PUBLIC_GCIP_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_GCIP_AUTH_DOMAIN }}
          NEXT_PUBLIC_ENTRA_TENANT_ID: ${{ vars.NEXT_PUBLIC_ENTRA_TENANT_ID }}

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --build-arg NEXT_PUBLIC_APP_URL="${{ vars.NEXT_PUBLIC_APP_URL }}" \
            --build-arg NEXT_PUBLIC_GCIP_API_KEY="${{ vars.NEXT_PUBLIC_GCIP_API_KEY }}" \
            --build-arg NEXT_PUBLIC_GCIP_PROJECT_ID="${{ vars.NEXT_PUBLIC_GCIP_PROJECT_ID }}" \
            --build-arg NEXT_PUBLIC_GCIP_AUTH_DOMAIN="${{ vars.NEXT_PUBLIC_GCIP_AUTH_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_ENTRA_TENANT_ID="${{ vars.NEXT_PUBLIC_ENTRA_TENANT_ID }}" \
            -t "${IMAGE_REPO}:${GITHUB_SHA}" \
            -t "${IMAGE_REPO}:latest" \
            .

      - name: Push image
        run: |
          docker push "${IMAGE_REPO}:${GITHUB_SHA}"
          docker push "${IMAGE_REPO}:latest"

      - name: Deploy to Cloud Run (image only)
        run: |
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE_REPO}:${GITHUB_SHA}" \
            --region "${GCP_REGION}" \
            --project "${GCP_PROJECT}" \
            --quiet

      # A deploy that reports success and serves a broken revision is the failure mode this
      # repository keeps hitting, and it is invisible until someone tries to sign in. These
      # are the same two probes the daily bug hunt runs, from the same script, so the two
      # cannot drift; the difference is only when they run. Before this step the window
      # between shipping a broken image and noticing was up to a day, since the sweep fires
      # at 06:17.
      #
      # It gates the job deliberately: a red deploy is the point. The revision is already
      # taking traffic by the time this runs, so a failure here is a signal to roll back, not
      # a prevention. `gcloud run services update-traffic` to the previous revision is the
      # rollback, and Cloud Run keeps them.
      - name: Smoke check the revision that just took traffic
        env:
          APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
        run: bash .github/scripts/smoke.sh all "$APP_URL"

      # -----------------------------------------------------------------------
      # Database migrations are intentionally NOT run here. Per repo convention
      # (CLAUDE.md), `prisma migrate deploy` is an explicit, auditable release
      # step run by a human, not on every push.
      #
      # Deploy-on-push makes this sharper than it was. A merge that carries a
      # Prisma migration now ships code expecting a schema the database does not
      # have yet, within minutes and with nobody choosing the moment. So for any
      # change with a migration in it: run `prisma migrate deploy` FIRST, against
      # a schema the currently running code still tolerates, and merge second.
      # Additive migrations make that easy; a rename or a drop needs two releases,
      # the first of which is additive. Running it from this runner
      # would also require reaching Cloud SQL via the Cloud SQL Auth Proxy (or a
      # dedicated Cloud Run Job with the proxy sidecar), which is out of scope.
      #
      # Recommended: run the documented manual release step, e.g. with the proxy:
      #   cloud-sql-proxy --port 5432 <PROJECT>:<REGION>:<INSTANCE> &
      #   DIRECT_URL="postgresql://USER:PASS@127.0.0.1:5432/DB" npx prisma migrate deploy
      #
      # - name: Run migrations (manual / opt-in only, do NOT enable unattended)
      #   run: |
      #     # Requires Cloud SQL Auth Proxy + DIRECT_URL pointing at it.
      #     npx prisma migrate deploy
      # -----------------------------------------------------------------------
