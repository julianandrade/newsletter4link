<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#1e3a5f"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="200" stroke="#00b4d8" stroke-width="3" fill="none" opacity="0.4"/>

  <!-- Middle ring -->
  <circle cx="256" cy="256" r="140" stroke="#00b4d8" stroke-width="2.5" fill="none" opacity="0.5"/>

  <!-- Inner ring -->
  <circle cx="256" cy="256" r="80" stroke="#00b4d8" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="12" fill="#00b4d8"/>

  <!-- Radar sweep (gradient cone) -->
  <defs>
    <linearGradient id="sweepGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Sweep arc -->
  <path d="M256 256 L256 56 A200 200 0 0 1 426 156 Z" fill="url(#sweepGradient)"/>

  <!-- Sweep line (leading edge) -->
  <line x1="256" y1="256" x2="426" y2="156" stroke="#00b4d8" stroke-width="3" stroke-linecap="round"/>

  <!-- Signal blips -->
  <circle cx="340" cy="180" r="8" fill="#00b4d8" opacity="0.9"/>
  <circle cx="380" cy="220" r="6" fill="#00b4d8" opacity="0.7"/>
  <circle cx="300" cy="120" r="5" fill="#00b4d8" opacity="0.5"/>

  <!-- Pulse rings around main blip -->
  <circle cx="340" cy="180" r="16" stroke="#00b4d8" stroke-width="2" fill="none" opacity="0.4"/>
  <circle cx="340" cy="180" r="24" stroke="#00b4d8" stroke-width="1.5" fill="none" opacity="0.2"/>
</svg>
