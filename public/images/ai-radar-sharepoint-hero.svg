<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" fill="none">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="heroBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="30%" stop-color="#1a3252"/>
      <stop offset="70%" stop-color="#162d4a"/>
      <stop offset="100%" stop-color="#122540"/>
    </linearGradient>

    <!-- Radar sweep gradient -->
    <linearGradient id="heroSweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Glow effect -->
    <filter id="heroGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Large glow for main radar -->
    <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="600" fill="url(#heroBgGradient)"/>

  <!-- Large grid (subtle) -->
  <g stroke="#00b4d8" stroke-opacity="0.06" stroke-width="1">
    <!-- Horizontal -->
    <line x1="0" y1="100" x2="1920" y2="100"/>
    <line x1="0" y1="200" x2="1920" y2="200"/>
    <line x1="0" y1="300" x2="1920" y2="300"/>
    <line x1="0" y1="400" x2="1920" y2="400"/>
    <line x1="0" y1="500" x2="1920" y2="500"/>
    <!-- Vertical -->
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="800" y1="0" x2="800" y2="600"/>
    <line x1="1000" y1="0" x2="1000" y2="600"/>
    <line x1="1200" y1="0" x2="1200" y2="600"/>
    <line x1="1400" y1="0" x2="1400" y2="600"/>
    <line x1="1600" y1="0" x2="1600" y2="600"/>
    <line x1="1800" y1="0" x2="1800" y2="600"/>
  </g>

  <!-- Main radar (left-center) -->
  <g transform="translate(400, 300)">
    <!-- Outer rings -->
    <circle r="280" stroke="#00b4d8" stroke-width="1.5" fill="none" opacity="0.12"/>
    <circle r="220" stroke="#00b4d8" stroke-width="1.5" fill="none" opacity="0.15"/>
    <circle r="160" stroke="#00b4d8" stroke-width="1.5" fill="none" opacity="0.18"/>
    <circle r="100" stroke="#00b4d8" stroke-width="1.5" fill="none" opacity="0.22"/>
    <circle r="50" stroke="#00b4d8" stroke-width="1.5" fill="none" opacity="0.28"/>

    <!-- Center point -->
    <circle r="8" fill="#00b4d8" opacity="0.9" filter="url(#bigGlow)"/>

    <!-- Radar sweep -->
    <path d="M0 0 L0 -220 A220 220 0 0 1 190 110 Z" fill="url(#heroSweepGrad)" opacity="0.7"/>
    <line x1="0" y1="0" x2="190" y2="110" stroke="#00b4d8" stroke-width="3" opacity="0.9"/>

    <!-- Cross hairs -->
    <line x1="-280" y1="0" x2="280" y2="0" stroke="#00b4d8" stroke-width="1" opacity="0.1"/>
    <line x1="0" y1="-280" x2="0" y2="280" stroke="#00b4d8" stroke-width="1" opacity="0.1"/>
  </g>

  <!-- Secondary radar (right side, smaller) -->
  <g transform="translate(1500, 300)" opacity="0.5">
    <circle r="150" stroke="#00b4d8" stroke-width="1" fill="none" opacity="0.15"/>
    <circle r="100" stroke="#00b4d8" stroke-width="1" fill="none" opacity="0.2"/>
    <circle r="50" stroke="#00b4d8" stroke-width="1" fill="none" opacity="0.25"/>
    <circle r="5" fill="#00b4d8" opacity="0.7"/>

    <!-- Sweep at different angle -->
    <path d="M0 0 L-100 0 A100 100 0 0 1 -50 -87 Z" fill="url(#heroSweepGrad)" opacity="0.5"/>
    <line x1="0" y1="0" x2="-50" y2="-87" stroke="#00b4d8" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Signal blips scattered across -->
  <g filter="url(#heroGlow)">
    <!-- Near main radar -->
    <circle cx="500" cy="180" r="6" fill="#00b4d8" opacity="0.9"/>
    <circle cx="320" cy="380" r="5" fill="#00b4d8" opacity="0.8"/>
    <circle cx="550" cy="320" r="4" fill="#00b4d8" opacity="0.7"/>
    <circle cx="280" cy="220" r="4" fill="#00b4d8" opacity="0.6"/>

    <!-- Middle area -->
    <circle cx="850" cy="250" r="5" fill="#00b4d8" opacity="0.6"/>
    <circle cx="950" cy="400" r="4" fill="#00b4d8" opacity="0.5"/>
    <circle cx="1100" cy="180" r="4" fill="#00b4d8" opacity="0.5"/>

    <!-- Near secondary radar -->
    <circle cx="1420" cy="220" r="5" fill="#00b4d8" opacity="0.7"/>
    <circle cx="1550" cy="420" r="4" fill="#00b4d8" opacity="0.6"/>
    <circle cx="1620" cy="280" r="3" fill="#00b4d8" opacity="0.5"/>
  </g>

  <!-- Pulse rings around main blips -->
  <circle cx="500" cy="180" r="14" stroke="#00b4d8" stroke-width="1.5" fill="none" opacity="0.4"/>
  <circle cx="500" cy="180" r="24" stroke="#00b4d8" stroke-width="1" fill="none" opacity="0.2"/>
  <circle cx="320" cy="380" r="12" stroke="#00b4d8" stroke-width="1.5" fill="none" opacity="0.3"/>

  <!-- Wave emanations (right edge) -->
  <g transform="translate(1850, 300)" opacity="0.25">
    <path d="M0 -100 Q40 -100 40 0 Q40 100 0 100" stroke="#00b4d8" stroke-width="2" fill="none"/>
    <path d="M20 -140 Q80 -140 80 0 Q80 140 20 140" stroke="#00b4d8" stroke-width="2" fill="none"/>
    <path d="M40 -180 Q120 -180 120 0 Q120 180 40 180" stroke="#00b4d8" stroke-width="2" fill="none"/>
  </g>

  <!-- Wave emanations (left edge) -->
  <g transform="translate(70, 300) scale(-1,1)" opacity="0.2">
    <path d="M0 -80 Q30 -80 30 0 Q30 80 0 80" stroke="#00b4d8" stroke-width="2" fill="none"/>
    <path d="M15 -120 Q60 -120 60 0 Q60 120 15 120" stroke="#00b4d8" stroke-width="2" fill="none"/>
  </g>

  <!-- Scan lines texture -->
  <g stroke="#00b4d8" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="20" x2="1920" y2="20"/>
    <line x1="0" y1="60" x2="1920" y2="60"/>
    <line x1="0" y1="140" x2="1920" y2="140"/>
    <line x1="0" y1="180" x2="1920" y2="180"/>
    <line x1="0" y1="220" x2="1920" y2="220"/>
    <line x1="0" y1="260" x2="1920" y2="260"/>
    <line x1="0" y1="340" x2="1920" y2="340"/>
    <line x1="0" y1="380" x2="1920" y2="380"/>
    <line x1="0" y1="420" x2="1920" y2="420"/>
    <line x1="0" y1="460" x2="1920" y2="460"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="580" x2="1920" y2="580"/>
  </g>

  <!-- Diagonal accent lines -->
  <g stroke="#00b4d8" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="600" x2="300" y2="0"/>
    <line x1="100" y1="600" x2="400" y2="0"/>
    <line x1="1520" y1="600" x2="1820" y2="0"/>
    <line x1="1620" y1="600" x2="1920" y2="0"/>
  </g>
</svg>
